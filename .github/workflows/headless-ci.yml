name: Headless CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} headless
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[render]' 'pytest>=8,<9' 'pytest-asyncio>=0.23,<1' 'ruff>=0.16,<0.17'

      - name: Compile
        run: python -m compileall -q src scripts tests

      - name: Lint
        run: python -m ruff check src scripts tests

      - name: Full headless regression
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider
